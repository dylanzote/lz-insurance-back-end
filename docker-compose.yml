version: '3.8'

services:
  # PostgreSQL for each service (in production, use separate instances)
  postgres-customer:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance123
    ports:
      - "5432:5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance123
    ports:
      - "5433:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  postgres-policy:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policy_db
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance123
    ports:
      - "5434:5432"
    volumes:
      - postgres_policy_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  postgres-identity:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance123
    ports:
      - "5435:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  # Redis for session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - insurance-network

  # Kafka + Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - insurance-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - insurance-network

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - insurance-network

  # Keycloak for authentication. 26.x matches keycloak-admin-client 26.0.8 used by
  # insurance-security-keycloak (US-M2-001). Keycloak 26 renamed the bootstrap admin env vars
  # to KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - insurance-network

  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - insurance-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - insurance-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - insurance-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI to view caught emails
    networks:
      - insurance-network

networks:
  insurance-network:
    driver: bridge

volumes:
  postgres_customer_data:
  postgres_product_data:
  postgres_policy_data:
  postgres_identity_data:
  redis_data:
  minio_data:
  postgres_keycloak_data:
  prometheus_data:
  grafana_data: