databaseChangeLog:
  - changeSet:
      id: 009-create-approval-requests
      author: identity
      comment: Approval gate that must reach APPROVED before Keycloak provisioning.
      changes:
        - createTable:
            tableName: approval_requests
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: SYSTEM
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
              - column:
                  name: deleted_by
                  type: VARCHAR(255)
              - column:
                  name: identity_profile_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_approval_requests_profile
                    references: identity_profiles(id)
              - column:
                  name: requested_by_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_approval_requests_requested_by
                    references: identity_profiles(id)
              - column:
                  name: request_notes
                  type: VARCHAR(1024)
              - column:
                  name: requested_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_by_id
                  type: VARCHAR(36)
                  constraints:
                    foreignKeyName: fk_approval_requests_reviewed_by
                    references: identity_profiles(id)
              - column:
                  name: review_notes
                  type: VARCHAR(1024)
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_at
                  type: TIMESTAMP
