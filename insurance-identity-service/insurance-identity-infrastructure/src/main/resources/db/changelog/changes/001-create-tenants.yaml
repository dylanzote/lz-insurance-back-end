databaseChangeLog:
  - changeSet:
      id: 001-create-tenants
      author: identity
      comment: Root organizational scope. headquarter_branch_id has no FK (branches
        do not exist yet at 001 and it is set later during bootstrap).
      changes:
        - createTable:
            tableName: tenants
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: SYSTEM
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
              - column:
                  name: deleted_by
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_tenants_code
              - column:
                  name: country
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: bootstrapped
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: headquarter_branch_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
