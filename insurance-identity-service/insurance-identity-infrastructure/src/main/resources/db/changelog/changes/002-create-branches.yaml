databaseChangeLog:
  - changeSet:
      id: 002-create-branches
      author: identity
      comment: Branch hierarchy; parent_branch_id self-references branches.
      changes:
        - createTable:
            tableName: branches
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  defaultValue: SYSTEM
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
              - column:
                  name: deleted_by
                  type: VARCHAR(255)
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_branches_tenant
                    references: tenants(id)
              - column:
                  name: parent_branch_id
                  type: VARCHAR(36)
                  constraints:
                    foreignKeyName: fk_branches_parent
                    references: branches(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: branches
            columnNames: tenant_id, code
            constraintName: uq_branches_tenant_code
