spring.application.name=insurance-identity-service

# --- Datasource (local docker-compose: postgres-identity on 5435) ---
spring.datasource.url=jdbc:postgresql://localhost:5435/identity_db
spring.datasource.username=insurance
spring.datasource.password=insurance123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Schema is owned by Liquibase; Hibernate never mutates it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
